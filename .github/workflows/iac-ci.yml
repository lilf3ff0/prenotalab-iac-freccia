name: PrenotaLab IaC gate

# TODO CI-1 - il workflow deve partire a ogni pull request verso main.
#   Oggi parte solo a mano: sostituisci il trigger.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate:
    name: fmt-validate-test-policy
    runs-on: ubuntu-latest
    steps:
